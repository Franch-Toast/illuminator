name: Docker Build

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Docker image tag (留空则使用 git SHA short)'
        required: false
        type: string
        default: ''
      skip_tests:
        description: '跳过测试（仅在 CI 已验证通过时使用）'
        required: false
        type: boolean
        default: false

jobs:
  verify:
    name: "Quick Verify"
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: docker-verify
          repository-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libbpf-dev libelf-dev zlib1g-dev libsqlite3-dev clang

      - name: Build & Test
        run: |
          bazel build //src/...
          bazel test //src/... --test_output=errors

  build:
    name: "Build Docker Image"
    needs: verify
    if: ${{ always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          TAG="${{ inputs.docker_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Building image with tag: $TAG"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: illuminator:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size report
        run: |
          echo "=== Docker Image Built ==="
          docker images illuminator:${{ steps.tag.outputs.tag }} \
            --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}"
          echo ""
          echo "Run command:"
          echo "  docker run --cap-add CAP_BPF --cap-add CAP_PERFMON -p 9527:9527 illuminator:${{ steps.tag.outputs.tag }}"

      - name: Smoke test container
        run: |
          docker run --rm illuminator:${{ steps.tag.outputs.tag }} --version || true
