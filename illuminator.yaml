global:
  log_level: info
  data_dir: /tmp/illuminator_data

pipelines:
  cpu_utilization:
    source:
      type: cpu_utilization
      config:
        interval_ms: 1000
        collect_per_core: true
        collect_frequency: true
        ema_alpha: 0.3
    sinks:
      - type: local_storage
        config:
          backend: sqlite
          path: /tmp/illuminator_data
          pipeline: cpu_utilization
      - type: websocket_sink
        config:
          pipeline_key: cpu_utilization
          max_buffer_size: 30

  cpu_processes:
    source:
      type: process_cpu
      config:
        interval_ms: 2000
        top_n: 50
        thread_detail_threshold_pct: 3.0
    sinks:
      - type: local_storage
        config:
          backend: sqlite
          path: /tmp/illuminator_data
          pipeline: cpu_processes

  cpu_profile:
    source:
      type: cpu_profiler
      config:
        frequency_hz: 49
        mode: aggregated
        stack_depth: 128
        user_stacks: true
        kernel_stacks: true
        bpf_object: /sandbox/illuminator/build/bpf/cpu_profiler.bpf.o
    processors:
      - type: stack_symbolizer
        config:
          demangle: true
          kernel_symbols: true
          cache_ttl_sec: 30
      - type: stack_merger
        config:
          group_by: comm
          include_kernel: true
    aggregator:
      type: cpu_stats_aggregator
      config:
        window_sec: 30
    sinks:
      - type: local_storage
        config:
          backend: sqlite
          path: /tmp/illuminator_data
          pipeline: cpu_profile

  offcpu_analysis:
    source:
      type: offcpu_profiler
      config:
        min_duration_us: 100
        user_stacks: true
        kernel_stacks: true
        bpf_object: /sandbox/illuminator/build/bpf/offcpu_profiler.bpf.o
    processors:
      - type: stack_symbolizer
        config:
          demangle: true
          kernel_symbols: true
          cache_ttl_sec: 30
      - type: stack_merger
        config:
          group_by: comm
          include_kernel: true
    sinks:
      - type: local_storage
        config:
          backend: sqlite
          path: /tmp/illuminator_data
          pipeline: offcpu_analysis
      - type: websocket_sink
        config:
          pipeline_key: offcpu_analysis
          max_buffer_size: 50

  sched_analysis:
    source:
      type: sched_analyzer
      config:
        detailed_mode: true
        aggregate_interval_ms: 5000
        track_migrations: true
        bpf_object: /sandbox/illuminator/build/bpf/sched_analyzer.bpf.o
    sinks:
      - type: local_storage
        config:
          backend: sqlite
          path: /tmp/illuminator_data
          pipeline: sched_analysis
      - type: websocket_sink
        config:
          pipeline_key: sched_analysis
          max_buffer_size: 30
